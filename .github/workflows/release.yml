name: release

# Push a version tag (e.g. git tag v2.0.0 && git push origin v2.0.0) to publish a release.
# Zenodo, once enabled for this repository, archives every published release and assigns
# it a DOI, taking the title, authors and licence from CITATION.cff.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate CITATION.cff
        run: |
          pip install cffconvert
          cffconvert --validate

      - name: Check that the tag matches the version in CITATION.cff
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' CITATION.cff)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CITATION.cff version $version"
            exit 1
          fi

      - name: Run the tests
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "GraphLens $GITHUB_REF_NAME" --generate-notes
