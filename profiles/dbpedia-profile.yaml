target_class: "http://dbpedia.org/ontology/Film"

labels:
  volume: "Production Budget ($)"
  success: "Recouped Budget ($)"
  rate: "Budget Recovery Rate"
  category: "Original language"
  location: "Country"
  entity_identifier: "Film Title"
  entity_group: "Films"
  time: "Release year"
  count: "Films"
  band: "Recovery band"

attributes:
  independent_metrics:
    - identifier: "budget"
      sparql_var: "budget"
      description: "Primary volume metric (x1)"
    - identifier: "recoupedBudget"
      sparql_var: "recoupedBudget"
      description: "Secondary success metric (x2 <= x1)"

  derived_ratios:
    - identifier: "recoveryRate"
      sparql_var: "recoveryRate"
      description: "Derived ratio (y = x2 / x1) bounded in [0, 1]"

  nominal_categories:
    - identifier: "language"
      sparql_var: "language"
      description: "Original language of the film (c1)"
    - identifier: "country"
      sparql_var: "country"
      semantic_type: "geo"
      description: "Geographic location attribute (c2)"

  temporal_indicators:
    - identifier: "year"
      sparql_var: "year"
      description: "Temporal release year indicator (t)"

  entity_identifiers:
    - identifier: "film"
      sparql_var: "film"
      description: "Entity URI"
    - identifier: "label"
      sparql_var: "label"
      description: "Entity identifier label (e)"

filters:
  year_min: 1950
  year_max: 2026

clustering:
  log_volume: true
  k_min: 2
  k_max: 4
  # Two bands: films that did and did not earn back their budget. About 60% of films
  # recover exactly 100% (gross is capped at the budget), so a third cluster only splits
  # the recovered films by budget size and would be mislabelled by recovery rate.
  fixed_k: 2
  stability_runs: 50

cluster_bands:      # bands are ordered by mean recovery rate, lowest first
  - "Low Recovery Band"
  - "High Recovery Band"

analysis:
  corr_method: "spearman"
  top_categories: 10      # charts show the 10 most frequent languages, the rest as "Other"

# Historical country names that DBpedia uses, drawn on today's map (delete to keep them apart)
value_aliases:
  country:
    "British Hong Kong": "Hong Kong"
    "French Third Republic": "France"
    "United Kingdom Of Great Britain And Ireland": "United Kingdom"
